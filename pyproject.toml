[project]
name = "jerry-bot-tts"
version = "0.1.0"
description = "Helper for jerry-bot to provide a socket-based daemon to generate kokoro TTS as a child process."
authors = [
    { name = "squid1127", email = "<120748767+squid1127@users.noreply.github.com>" },
]
license = "MIT"
readme = "README.md"
requires-python = ">3.10, <3.13"
dependencies = [
    "kokoro (>=0.9.4,<0.10.0)",
    "soundfile (>=0.14.0,<0.15.0)",
    "pydantic (>=2.13.4,<3.0.0)",
]

[project.scripts]
jerry-bot-tts = "jerry_bot_tts:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
